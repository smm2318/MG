<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>My Browser</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="newtab" title="New tab">+</button>
  </div>
  <div id="toolbar">
    <button id="back">←</button>
    <button id="forward">→</button>
    <button id="reload">⟳</button>
    <input id="address" type="text" placeholder="Search Google or enter address" autofocus>
  </div>
  <div id="views"></div>
  <script src="browser.js"></script>
</body>
</html>
